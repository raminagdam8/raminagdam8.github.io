<style>
  :root {
    --bg: #14222B;
    --bg-deep: #0f1a21;
    --fg: #c9d3d9;              /* soft off-white, pulled toward the background */
    --fg-2: #8fa0ab;
    --fg-3: #63788a;
    --line: rgba(201, 211, 217, 0.09);
    --line-2: rgba(201, 211, 217, 0.2);
    --hover: rgba(201, 211, 217, 0.045);
    --green: #00ff41;
    --glow: 0, 255, 65;
    --pad: clamp(20px, 4vw, 48px);
    --mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  }

  * { box-sizing: border-box; }

  html { color-scheme: dark; scrollbar-color: #2c4050 var(--bg); scrollbar-width: thin; }
  html:has(dialog[open]) { overflow: hidden; }

  body {
    margin: 0;
    min-height: 100vh;
    min-height: 100svh;
    display: flex;
    flex-direction: column;
    background: var(--bg);
    color: var(--fg);
    font-family: var(--mono);
    font-size: 13px;
    line-height: 20px;
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
  }

  ::selection { background: rgba(var(--glow), 0.22); color: #fff; }
  button { font: inherit; color: inherit; }
  :focus-visible { outline: 1px solid var(--green); outline-offset: 3px; }

  .wrap { width: 100%; max-width: 1200px; margin: 0 auto; padding: 0 var(--pad); }

  /* ───────── top ───────── */

  .top { padding-top: clamp(22px, 3.4vw, 36px); }
  .mark { display: inline-block; line-height: 0; }
  #mark { display: grid; grid-template-columns: repeat(17, 4px); grid-auto-rows: 4px; gap: 1px; }
  #mark i { background: var(--green); box-shadow: 0 0 5px rgba(var(--glow), 0.55); }

  h1 {
    margin: clamp(40px, 8vh, 84px) 0 0;
    font-weight: 400;
    font-size: clamp(28px, 4vw, 52px);
    line-height: 1.08;
    letter-spacing: -0.03em;
  }
  h1 .cur {
    display: inline-block;
    width: 0.42em;
    height: 0.42em;
    margin-left: 0.18em;
    background: var(--green);
    box-shadow: 0 0 10px rgba(var(--glow), 0.6);
  }
  .sub { margin: 16px 0 0; font-size: 14px; color: var(--fg-2); }

  /* ───────── numbers, drawn in the logo's pixels ───────── */

  .stats { display: flex; flex-wrap: wrap; gap: 28px 72px; margin-top: clamp(36px, 6vh, 60px); }
  .num { line-height: 0; }
  .num svg {
    height: clamp(38px, 6vw, 68px);
    width: auto;
    display: block;
    filter: drop-shadow(0 0 8px rgba(var(--glow), 0.4));
  }
  .num rect { fill: var(--green); animation: boot 0.8s ease-out var(--d) both; }
  .stat .lbl { margin-top: 14px; color: var(--fg-3); }

  @keyframes boot {
    0%   { opacity: 0; }
    18%  { opacity: 1; }
    30%  { opacity: 0.1; }
    46%  { opacity: 1; }
    58%  { opacity: 0.35; }
    72%  { opacity: 1; }
    100% { opacity: 1; }
  }

  /* ───────── names ───────── */

  .feat { margin-top: clamp(44px, 7vh, 72px); padding-top: 28px; border-top: 1px solid var(--line); }
  .feat .lab { color: var(--fg-3); margin-bottom: 14px; }
  .names { display: flex; flex-wrap: wrap; gap: 6px 30px; font-size: 14.5px; line-height: 26px; }
  .names span { color: var(--fg); }
  .names .rest { color: var(--fg-3); }

  /* ───────── countries ───────── */

  .countries { margin-top: clamp(44px, 7vh, 72px); }

  .chead {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 20px;
    flex-wrap: wrap;
    margin-bottom: 18px;
  }
  .chead .lab { color: var(--fg-3); }

  .find { display: flex; align-items: center; gap: 10px; border-bottom: 1px solid var(--line-2); padding-bottom: 5px; transition: border-color 0.2s ease; min-width: min(280px, 100%); }
  .find:focus-within { border-color: var(--green); }
  .find .prompt { color: var(--green); }
  .find input {
    flex: 1;
    min-width: 0;
    background: none;
    border: 0;
    outline: 0;
    padding: 0;
    color: var(--fg);
    caret-color: var(--green);
    font: 400 13px/20px var(--mono);
  }
  .find input::placeholder { color: var(--fg-3); }

  .tiles {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(168px, 1fr));
    border-top: 1px solid var(--line);
    border-left: 1px solid var(--line);
  }
  .tiles:not(.all) .tile.extra { display: none; }

  .tile {
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    gap: 22px;
    min-height: 92px;
    padding: 16px 16px 14px;
    background: none;
    border: 0;
    border-right: 1px solid var(--line);
    border-bottom: 1px solid var(--line);
    text-align: left;
    cursor: pointer;
    transition: background 0.15s ease;
  }
  .tile[hidden] { display: none; }
  .tile:hover, .tile:focus-visible { background: var(--hover); }
  .tile:focus-visible { outline-offset: -3px; }
  .tile .cn { color: var(--fg); font-weight: 500; overflow-wrap: anywhere; }
  .tile:hover .cn { color: #e6edf1; }
  .tile .foot { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
  .tile .bar { display: flex; gap: 2px; }
  .tile .bar i { width: 5px; height: 5px; background: var(--fg); opacity: 0.12; }
  .tile .bar i.on { opacity: 0.8; }
  .tile b { font-weight: 400; color: var(--fg-2); font-variant-numeric: tabular-nums; }
  .tile:hover .bar i.on { background: var(--green); opacity: 1; }
  .tile:hover b { color: var(--green); }

  .toggle {
    margin-top: 22px;
    background: none;
    border: 0;
    padding: 0;
    color: var(--fg-2);
    cursor: pointer;
    text-decoration: underline;
    text-decoration-color: var(--line-2);
    text-underline-offset: 5px;
  }
  .toggle:hover { color: var(--green); }
  #none { padding: 28px 0; color: var(--fg-3); }

  /* ───────── dialog ───────── */

  dialog {
    width: min(720px, calc(100vw - 32px));
    max-height: min(84vh, 760px);
    padding: 0;
    color: var(--fg);
    background: var(--bg-deep);
    border: 1px solid var(--line-2);
    border-top: 1px solid var(--green);
    overflow: hidden;
  }
  dialog:focus { outline: 0; }
  dialog::backdrop { background: rgba(7, 13, 17, 0.78); }
  .dbox {
    position: relative;
    max-height: min(84vh, 760px);
    overflow: auto;
    padding: 30px clamp(20px, 4vw, 36px) 28px;
    scrollbar-width: thin;
  }
  .x {
    position: absolute;
    top: 16px;
    right: 16px;
    background: none;
    border: 1px solid var(--line-2);
    color: var(--fg-3);
    padding: 3px 7px;
    font-size: 11px;
    line-height: 1;
    cursor: pointer;
  }
  .x:hover { color: var(--fg); border-color: var(--fg-3); }
  dialog h2 { margin: 0; padding-right: 60px; font-weight: 400; font-size: 26px; line-height: 1.15; letter-spacing: -0.02em; }
  .dsub { margin: 8px 0 0; color: var(--fg-3); }
  #dlg-list { list-style: none; margin: 26px 0 0; padding: 0; columns: 2 250px; column-gap: 36px; }
  #dlg-list li { position: relative; padding: 6px 0 6px 16px; break-inside: avoid; }
  #dlg-list li::before { content: ""; position: absolute; left: 0; top: 15px; width: 5px; height: 5px; background: var(--fg-3); }
  .dmore { margin: 22px 0 0; padding-top: 18px; border-top: 1px solid var(--line); color: var(--fg-3); }
  .dmore b { font-weight: 400; color: var(--green); }

  /* ───────── footer ───────── */

  footer {
    margin-top: auto;
    padding-top: 72px;
    padding-bottom: calc(env(safe-area-inset-bottom, 0px) + 28px);
    color: var(--fg-3);
    font-size: 11.5px;
  }
  footer .wrap { display: flex; justify-content: space-between; }

  noscript { display: block; padding: 40px 0; color: var(--fg-2); }

  @media (max-width: 620px) {
    .tiles { grid-template-columns: repeat(2, 1fr); }
    .tile { min-height: 84px; padding: 14px 14px 12px; }
    #dlg-list { columns: 1; }
    .find { width: 100%; }
    .names { gap: 4px 22px; font-size: 13.5px; }
  }

  @media (prefers-reduced-motion: reduce) {
    .num rect { animation: none; }
  }
</style>
</head>

    "........#...#.##.",
    "####....#..##..#.",

  });
  const rest = document.createElement("span");
  rest.className = "rest";
  rest.textContent = `+ ${fmt(D.total - Math.min(FEAT, D.featured.length))} more`;
  namesEl.appendChild(rest);

  /* ---------- country tiles ---------- */
  const TOP = 24, BARS = 8;
  const tilesEl = $("#tiles"), toggleEl = $("#toggle"), noneEl = $("#none"), cq = $("#cq");
  const maxC = D.countries[0][1];
  let expanded = false;

  D.countries.forEach(([name, count], idx) => {
    const lit = Math.max(1, Math.round(BARS * Math.log(count) / Math.log(maxC)));
    const b = document.createElement("button");
    b.type = "button";
    b.className = "tile" + (idx >= TOP ? " extra" : "");
    b.dataset.i = idx;
    b.dataset.n = norm(name);
    b.innerHTML =
      `<span class="cn"></span>` +
      `<span class="foot"><span class="bar" aria-hidden="true">${Array.from({ length: BARS }, (_, k) => `<i${k < lit ? ' class="on"' : ""}></i>`).join("")}</span><b>${fmt(count)}</b></span>`;
    b.querySelector(".cn").textContent = name;
    b.setAttribute("aria-label", `${name}, ${fmt(count)} investors`);
    tilesEl.appendChild(b);
  });

  function syncTiles() {
    const q = norm(cq.value).trim();
    let visible = 0;
    tilesEl.querySelectorAll(".tile").forEach((t) => {
      const ok = !q || t.dataset.n.includes(q);
      t.hidden = !ok;
      if (ok) visible++;
    });
    tilesEl.classList.toggle("all", expanded || !!q);
    toggleEl.hidden = !!q;
    noneEl.hidden = visible > 0;
    toggleEl.textContent = expanded ? "show fewer" : `show all ${D.countries.length} countries`;
  }
  toggleEl.addEventListener("click", () => { expanded = !expanded; syncTiles(); });
  cq.addEventListener("input", syncTiles);
  syncTiles();

  /* ---------- dialog ---------- */
  const dlg = $("#dlg");
  tilesEl.addEventListener("click", (e) => {
    const t = e.target.closest(".tile");
    if (!t) return;
    const [name, count, ids] = D.countries[+t.dataset.i];
    $("#dlg-title").textContent = name;
    $("#dlg-sub").textContent = `${fmt(count)} investors`;
    const ul = $("#dlg-list");
    ul.innerHTML = "";
    ids.forEach((i) => {
      const li = document.createElement("li");
      li.textContent = D.names[i];
      ul.appendChild(li);
    });
    const left = count - ids.length;
    const more = $("#dlg-more");
    more.hidden = left <= 0;
    more.innerHTML = left > 0 ? `<b>+ ${fmt(left)} more.</b> Visible to founders inside p01.` : "";
    dlg.showModal();
    dlg.focus();
    dlg.querySelector(".dbox").scrollTop = 0;
  });
  $("#dlg-x").addEventListener("click", () => dlg.close());
  dlg.addEventListener("click", (e) => { if (e.target === dlg) dlg.close(); });
})();
</script>
</body>
</html>
